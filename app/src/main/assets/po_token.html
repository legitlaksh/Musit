<!DOCTYPE html>
<html lang="en"><head><title></title><script>
// BotGuard runner for Musit. Network calls (Create / GenerateIT) are done in
// Kotlin; this page only executes the BotGuard VM and mints tokens.
// Results go back through the MusitPoToken JavascriptInterface.

var bgVmFunctions = null;
var poTokenMinter = null;
window.webPoSignalOutput = [];

function b64ToBytes(s) {
  s = String(s).replace(/-/g, '+').replace(/_/g, '/').replace(/\./g, '=');
  var bin = atob(s);
  var out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64Url(bytes) {
  var bin = '';
  for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_');
}

function err(prefix, e) {
  MusitPoToken.onError(prefix + ': ' + ((e && e.message) ? e.message : String(e)));
}

// challenge = { interpreterJs, globalName, program }
function bgRun(challenge) {
  try {
    if (!challenge.interpreterJs) throw new Error('no interpreter script');
    new Function(challenge.interpreterJs)();
    var vm = window[challenge.globalName];
    if (!vm) throw new Error('VM global not found: ' + challenge.globalName);
    if (!vm.a) throw new Error('VM has no .a()');

    bgVmFunctions = null;
    vm.a(challenge.program, function (asyncSnapshot, shutdown, passEvent, checkCamera) {
      bgVmFunctions = { asyncSnapshot: asyncSnapshot, shutdown: shutdown,
                        passEvent: passEvent, checkCamera: checkCamera };
    }, true, undefined, function () {}, [[], []]);

    var tries = 0;
    var timer = setInterval(function () {
      if (bgVmFunctions && bgVmFunctions.asyncSnapshot) {
        clearInterval(timer);
        try {
          bgVmFunctions.asyncSnapshot(function (response) {
            MusitPoToken.onBotguardResult(response);
          }, [undefined, undefined, window.webPoSignalOutput, undefined]);
        } catch (e) { err('snapshot', e); }
      } else if (++tries > 10000) {
        clearInterval(timer);
        err('bgRun', 'timeout waiting for VM functions');
      }
    }, 1);
  } catch (e) { err('bgRun', e); }
}

// integrityTokenB64 = base64 string from GenerateIT response[0]
async function bgCreateMinter(integrityTokenB64) {
  try {
    var getMinter = window.webPoSignalOutput[0];
    if (typeof getMinter !== 'function')
      throw new Error('webPoSignalOutput[0] is ' + typeof getMinter);
    var minter = await getMinter(b64ToBytes(integrityTokenB64));
    if (typeof minter !== 'function')
      throw new Error('minter is ' + typeof minter);
    poTokenMinter = minter;
    MusitPoToken.onMinterCreated();
  } catch (e) { err('createMinter', e); }
}

// identifier = visitorData string or videoId string
async function bgMint(identifier) {
  try {
    if (!poTokenMinter) throw new Error('minter not initialised');
    var result = await poTokenMinter(new TextEncoder().encode(identifier));
    if (!(result instanceof Uint8Array)) throw new Error('mint result is not Uint8Array');
    MusitPoToken.onPoToken(identifier, bytesToB64Url(result));
  } catch (e) { err('mint', e); }
}
</script></head><body></body></html>
